[theme]
base = "dark"
primaryColor = "#63B3ED"
backgroundColor = "#0f0f1a"
secondaryBackgroundColor = "#1a1a2e"
textColor = "#e2e8f0"
font = "sans serif"

[server]
headless = true
maxUploadSize = 500
maxMessageSize = 500
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
